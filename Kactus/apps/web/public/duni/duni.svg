<svg xmlns="http://www.w3.org/2000/svg" viewBox="15 28 290 290" width="700" height="700" role="img" aria-label="Cacto verde neon sorridente com coroa de rainha" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Cacto rainha</title>
<style>
.bob{animation:bob 3s ease-in-out infinite;transform-box:view-box;transform-origin:160px 300px}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-10px) scale(.98,1.02)}}
.shadow{animation:shadow 3s ease-in-out infinite;transform-box:view-box;transform-origin:160px 322px}
@keyframes shadow{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(.85);opacity:.35}}
.armL{animation:waveL 2.4s ease-in-out infinite;transform-box:view-box;transform-origin:126px 193px}
@keyframes waveL{0%,100%{transform:rotate(4deg)}50%{transform:rotate(-10deg)}}
.armR{animation:waveR 1.2s ease-in-out infinite;transform-box:view-box;transform-origin:194px 158px}
@keyframes waveR{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(14deg)}}
.eye{animation:blink 4.5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.pupils{animation:look 6s ease-in-out infinite}
@keyframes look{0%,40%,100%{transform:translate(0,0)}50%,65%{transform:translate(3px,-1px)}75%,85%{transform:translate(-3px,1px)}}
.glowpulse{animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
.crown{animation:tilt 3s ease-in-out infinite;transform-box:view-box;transform-origin:160px 80px}
@keyframes tilt{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(-3deg)}}
.twinkle{animation:twinkle 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes twinkle{0%,100%{transform:scale(0);opacity:0}50%{transform:scale(1);opacity:1}}
.spark{animation:rise linear infinite;opacity:0}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.8}100%{transform:translateY(-200px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.spark{display:none}}
</style>
<defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="6" result="b1"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="b2"/>
    <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="goldGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="sparkGlow" x="-200%" y="-200%" width="500%" height="500%">
    <feGaussianBlur stdDeviation="2.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <radialGradient id="bodyGrad" cx="45%" cy="40%" r="70%">
    <stop offset="0%" stop-color="#2a8a26"/>
    <stop offset="60%" stop-color="#155a17"/>
    <stop offset="100%" stop-color="#0b3a0d"/>
  </radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#fff3a8"/>
    <stop offset="55%" stop-color="#ffd23f"/>
    <stop offset="100%" stop-color="#e09a00"/>
  </linearGradient>
  <radialGradient id="groundGrad">
    <stop offset="0%" stop-color="#7CFF4F" stop-opacity=".9"/>
    <stop offset="100%" stop-color="#7CFF4F" stop-opacity="0"/>
  </radialGradient>
  <rect id="body" x="115" y="70" width="90" height="230" rx="45"/>
  <g id="armLshape"><rect x="60" y="120" width="36" height="90" rx="18"/><rect x="60" y="176" width="72" height="34" rx="17"/></g>
  <g id="armRshape"><rect x="224" y="95" width="36" height="80" rx="18"/><rect x="188" y="141" width="72" height="34" rx="17"/></g>
</defs>

<ellipse class="shadow" cx="160" cy="322" rx="80" ry="12" fill="url(#groundGrad)"/>

<g filter="url(#sparkGlow)" fill="#7CFF4F">
  <circle class="spark" cx="40" cy="300" r="2.5" style="animation-duration:6s;animation-delay:-1s"/>
  <circle class="spark" cx="85" cy="330" r="2" style="animation-duration:7s;animation-delay:-3s"/>
  <circle class="spark" cx="250" cy="310" r="3" style="animation-duration:5.5s;animation-delay:-2s"/>
  <circle class="spark" cx="285" cy="280" r="2" style="animation-duration:8s;animation-delay:-5s"/>
  <circle class="spark" cx="20" cy="250" r="2" style="animation-duration:7.5s;animation-delay:-6s"/>
  <circle class="spark" cx="230" cy="335" r="2.5" style="animation-duration:6.5s;animation-delay:-4s"/>
</g>

<g class="bob">
  <g class="glowpulse" filter="url(#glow)">
    <g fill="#7CFF4F" stroke="#7CFF4F" stroke-width="10" stroke-linejoin="round">
      <use href="#body"/>
      <use href="#armLshape" class="armL"/>
      <use href="#armRshape" class="armR"/>
    </g>
  </g>
  <g fill="url(#bodyGrad)">
    <use href="#body"/>
    <use href="#armLshape" class="armL"/>
    <use href="#armRshape" class="armR"/>
  </g>

  <g stroke="#7CFF4F" stroke-width="2.5" stroke-linecap="round" opacity=".55">
    <path d="M130 100l-6-4M190 100l6-4M126 215l-7 2M194 225l7 2M140 265l-5 5M180 265l5 5M160 285v7M134 240l-7-1M186 196l7-2"/>
    <g class="armL"><path d="M70 140l-6-3M70 165l-7 0M100 200l0 6"/></g>
    <g class="armR"><path d="M250 112l6-3M250 135l7 0M215 170l0 6"/></g>
  </g>

  <g class="crown">
    <g filter="url(#goldGlow)">
      <path d="M133 84 L130 52 L139 64 L146 44 L153 62 L160 36 L167 62 L174 44 L181 64 L190 52 L187 84 Z" fill="url(#gold)" stroke="#ffe680" stroke-width="2.5" stroke-linejoin="round"/>
      <rect x="131" y="76" width="58" height="10" rx="4" fill="#f0b400" stroke="#ffe680" stroke-width="2"/>
    </g>
    <g fill="#fffbe6">
      <circle cx="130" cy="51" r="3.6"/><circle cx="146" cy="43" r="3.6"/><circle cx="160" cy="34" r="4.2"/>
      <circle cx="174" cy="43" r="3.6"/><circle cx="190" cy="51" r="3.6"/>
    </g>
    <ellipse cx="160" cy="70" rx="5" ry="6" fill="#ff4f9a" stroke="#ffd1e6" stroke-width="1.5"/>
    <circle cx="144" cy="72" r="3" fill="#4fd8ff"/>
    <circle cx="176" cy="72" r="3" fill="#4fd8ff"/>
    <circle cx="146" cy="81" r="1.6" fill="#fff6c2"/><circle cx="160" cy="81" r="1.6" fill="#fff6c2"/><circle cx="174" cy="81" r="1.6" fill="#fff6c2"/>
  </g>
  <path class="twinkle" d="M200 40 l2.5 7 7 2.5 -7 2.5 -2.5 7 -2.5 -7 -7 -2.5 7 -2.5z" fill="#fff6c2" filter="url(#sparkGlow)"/>
  <path class="twinkle" d="M118 30 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z" fill="#fff6c2" filter="url(#sparkGlow)" style="animation-delay:-1.1s"/>

  <g class="eye"><circle cx="141" cy="150" r="12" fill="#fff"/><g class="pupils"><circle cx="143" cy="152" r="5.5" fill="#062006"/><circle cx="145" cy="149" r="1.8" fill="#fff"/></g></g>
  <g class="eye"><circle cx="179" cy="150" r="12" fill="#fff"/><g class="pupils"><circle cx="181" cy="152" r="5.5" fill="#062006"/><circle cx="183" cy="149" r="1.8" fill="#fff"/></g></g>

  <ellipse cx="128" cy="174" rx="8" ry="4" fill="#ff7ab6" opacity=".45"/>
  <ellipse cx="192" cy="174" rx="8" ry="4" fill="#ff7ab6" opacity=".45"/>

  <path d="M144 176 Q160 194 176 176" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
</g>
</svg>
