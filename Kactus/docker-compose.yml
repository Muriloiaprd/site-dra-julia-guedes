services:
  postgres:
    image: postgres:16-alpine
    container_name: kactus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kactus
      POSTGRES_PASSWORD: kactus
      POSTGRES_DB: kactus
    ports:
      - "5432:5432"
    volumes:
      - kactus_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kactus -d kactus"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kactus_pg_data:
