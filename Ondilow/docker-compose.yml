services:
  postgres:
    image: postgres:16-alpine
    container_name: ondilow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ondilow
      POSTGRES_PASSWORD: ondilow
      POSTGRES_DB: ondilow
    ports:
      - "5432:5432"
    volumes:
      - ondilow_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ondilow -d ondilow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ondilow_pg_data:
